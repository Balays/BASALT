name: DogMAG patch tests

on:
  push:
    branches:
      - DogMAG-article-clean
      - DogMAG-paper-v1.0
  pull_request:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile BASALT Python sources
        run: python -m compileall -q BASALT

      - name: Run focused DogMAG patch tests
        run: python -m unittest discover -s tests -v
